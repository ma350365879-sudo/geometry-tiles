name: Diagnose Worker

# 临时诊断：定位 CI 上 multiprocessing spawn worker 的问题。
# 验证通过后可删除此文件。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. import build123d 计时
        run: |
          python3 -u -c "
          import time
          t=time.time(); import build123d as bd; print(f'import build123d: {time.time()-t:.2f}s')
          t=time.time(); s=bd.import_step('卡扣元件.step'); print(f'import_step: {time.time()-t:.2f}s')
          "

      - name: 2. 直接调用 2D 构建（不经过子进程）
        run: |
          python3 -u -c "
          import time, tile_generator_v3 as t
          t0=time.time()
          r=t.get_p0_2d({'sides':3,'sideLen':12.0})
          print(f'get_p0_2d 直接调用: {time.time()-t0:.2f}s')
          "

      - name: 3. 测试 spawn 子进程能否启动
        run: |
          python3 -u -c "
          import time, multiprocessing as mp, tile_generator_v3 as t
          ctx=mp.get_context('spawn')
          q_in, q_out = ctx.Queue(), ctx.Queue()
          t0=time.time()
          p=ctx.Process(target=t._worker_2d, args=(q_in,q_out), daemon=True)
          p.start()
          print(f'  Process.start() 返回: {time.time()-t0:.2f}s, pid={p.pid}, alive={p.is_alive()}')
          q_in.put((1, {'sides':3,'sideLen':12.0}))
          print('  已投递任务，等待结果（最多 300s）...')
          try:
              rid, status, payload = q_out.get(timeout=300)
              print(f'  ✅ 收到结果: rid={rid} status={status} 耗时={time.time()-t0:.2f}s')
          except Exception as e:
              print(f'  ❌ 等待失败（{time.time()-t0:.2f}s）: {type(e).__name__}: {e}')
              print(f'  worker alive={p.is_alive()} exitcode={p.exitcode}')
          p.terminate()
          "

      - name: 4. 测试 _start_build_workers + _submit_build
        run: |
          python3 -u -c "
          import time, tile_generator_v3 as t
          t0=time.time()
          t._start_build_workers()
          print(f'  _start_build_workers: {time.time()-t0:.2f}s')
          for k,st in t._worker_state.items():
              print(f'    {k}: pid={st[\"proc\"].pid} alive={st[\"proc\"].is_alive()}')
          t0=time.time()
          try:
              t._submit_build('2d', ({'sides':3,'sideLen':12.0},))
              print(f'  ✅ _submit_build(2d): {time.time()-t0:.2f}s')
          except Exception as e:
              print(f'  ❌ _submit_build(2d) 失败（{time.time()-t0:.2f}s）: {type(e).__name__}: {e}')
          "

      - name: 5. 测试完整预热
        run: |
          python3 -u -c "
          import time, tile_generator_v3 as t
          t0=time.time()
          ok=t._warmup_workers(timeout_s=120)
          print(f'  _warmup_workers 返回={ok} 耗时={time.time()-t0:.2f}s')
          "
