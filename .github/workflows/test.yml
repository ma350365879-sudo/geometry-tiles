name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 为本项目实际验证通过的版本（build123d 0.8.0 + cadquery-ocp 7.7.2）
        python-version: ['3.9']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify STEP asset present
        run: |
          test -f 卡扣元件.step || (echo "缺少卡扣元件.step，服务无法启动" && exit 1)

      - name: Run regression tests
        # 几何布尔运算较慢，且个别用例会触发 60s 看门狗
        timeout-minutes: 30
        run: python3 test_wrap_segments.py

      - name: Smoke test server
        run: |
          # --warmup：启动时先阻塞预热构建 worker。
          # worker 为 spawn 模式，需重新导入 build123d 及约 771MB 的 OCCT；
          # 若不预热，这份开销会计入首个请求，并被 60s 看门狗误判为构建超时
          # （504），而看门狗重启 worker 后下次又是冷启动，形成死循环。
          python3 -u tile_generator_v3.py --no-browser --port 8768 --warmup \
            --warmup-timeout 300 > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          # 等待预热完成并输出服务日志（便于失败时排查）
          for i in $(seq 1 90); do
            if grep -q "已启动" /tmp/server.log 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/server.log

          curl -sf http://127.0.0.1:8768/api/health
          echo

          echo "冒烟测试 preview2d / preview / generate ..."
          for endpoint in preview2d preview; do
            code=$(curl -s --max-time 180 -X POST "http://127.0.0.1:8768/api/$endpoint" \
              -H 'Content-Type: application/json' -d '{"sides":4,"sideLen":40}' \
              -o /tmp/resp.json -w '%{http_code}')
            echo "  /api/$endpoint → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::/api/$endpoint 返回 $code"
              cat /tmp/resp.json
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done

          # STL 导出：确认返回二进制 STL 且体积合理
          code=$(curl -s --max-time 180 -X POST http://127.0.0.1:8768/api/generate \
            -H 'Content-Type: application/json' -d '{"sides":4,"sideLen":40}' \
            -o /tmp/tile.stl -w '%{http_code}')
          size=$(wc -c < /tmp/tile.stl | tr -d ' ')
          echo "  /api/generate → HTTP $code, STL ${size} bytes"
          kill $SERVER_PID 2>/dev/null || true
          if [ "$code" != "200" ] || [ "$size" -lt 1000 ]; then
            echo "::error::STL 导出失败（HTTP $code, ${size} bytes）"
            exit 1
          fi
          echo "✅ 冒烟测试全部通过"
