name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 为本项目实际验证通过的版本（build123d 0.8.0 + cadquery-ocp 7.7.2）
        python-version: ['3.9']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify STEP asset present
        run: |
          test -f 卡扣元件.step || (echo "缺少卡扣元件.step，服务无法启动" && exit 1)

      - name: Run regression tests
        # 几何布尔运算较慢，且个别用例会触发 60s 看门狗
        timeout-minutes: 30
        run: python3 test_wrap_segments.py

      - name: Smoke test server
        timeout-minutes: 15
        run: |
          # 服务先启动、预热在后台线程进行，因此端口一定可用。
          # 预热用于消除构建 worker 的冷启动开销（spawn 需重新导入
          # build123d 及约 771MB 的 OCCT，否则会计入首个请求并被 60s
          # 看门狗误判为构建超时）。
          python3 -u tile_generator_v3.py --no-browser --port 8768 --warmup \
            --warmup-timeout 600 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"

          # 1) 等端口就绪（服务启动很快，与预热无关）
          ready=0
          for i in $(seq 1 60); do
            if grep -q "已启动" /tmp/server.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::服务进程已退出"; break
            fi
            sleep 2
          done
          echo "=========== server.log ==========="
          cat /tmp/server.log || true
          echo "=================================="
          if [ "$ready" != "1" ]; then
            echo "::error::服务未在 120s 内就绪"; exit 1
          fi

          # 2) 健康检查
          if ! curl -sf --max-time 30 http://127.0.0.1:8768/api/health; then
            echo "::error::健康检查失败"; cat /tmp/server.log || true; exit 1
          fi
          echo

          # 3) 等服务后台预热完成（最多 600s）；未完成也继续，
          #    仅作提示——接口本身可用即视为通过。
          for i in $(seq 1 300); do
            if grep -q "预热完成\|预热未在" /tmp/server.log 2>/dev/null; then break; fi
            sleep 2
          done
          echo "--------- 预热后日志 ---------"
          cat /tmp/server.log || true
          echo "------------------------------"

          echo "冒烟测试 preview2d / preview / generate ..."
          for endpoint in preview2d preview; do
            code=$(curl -s --max-time 180 -X POST "http://127.0.0.1:8768/api/$endpoint" \
              -H 'Content-Type: application/json' -d '{"sides":4,"sideLen":40}' \
              -o /tmp/resp.json -w '%{http_code}' || echo 000)
            echo "  /api/$endpoint → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::/api/$endpoint 返回 $code"
              cat /tmp/resp.json || true
              cat /tmp/server.log || true
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done

          # STL 导出：确认返回二进制 STL 且体积合理
          code=$(curl -s --max-time 180 -X POST http://127.0.0.1:8768/api/generate \
            -H 'Content-Type: application/json' -d '{"sides":4,"sideLen":40}' \
            -o /tmp/tile.stl -w '%{http_code}' || echo 000)
          size=$(wc -c < /tmp/tile.stl | tr -d ' ')
          echo "  /api/generate → HTTP $code, STL ${size} bytes"
          kill $SERVER_PID 2>/dev/null || true
          if [ "$code" != "200" ] || [ "$size" -lt 1000 ]; then
            echo "::error::STL 导出失败（HTTP $code, ${size} bytes）"
            cat /tmp/server.log || true
            exit 1
          fi
          echo "✅ 冒烟测试全部通过"
